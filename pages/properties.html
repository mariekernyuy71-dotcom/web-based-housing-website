<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOUSE-LISTING_SITE</title>
    <link rel="stylesheet" href="../style/properties.css">
    <link rel="stylesheet" href="../style/style.css">
    </head>
<body>
<!--header-->
<div id="header"></div>

<section class="property">
  <div class="sub-property">
    <h2>Featured Properties</h2>
    <p>Browse our handpicked selection of properties in M&C House</p>
  </div>


<div class="property-section">
  <div class="category-buttons">
    <button class="cat-btn active" data-category="all">All</button>
    <button class="cat-btn" data-category="Student Cite">Student Cité</button>
    <button class="cat-btn" data-category="Plot">Plot</button>
    <button class="cat-btn" data-category="House">House</button>
    <button class="cat-btn" data-category="Studio">Studio</button>
  </div>

  <div class="price-box">
    <label for="priceSelect">FILTER BY PRICE:</label>
    <select id="priceSelect">
  <option value="all" selected>All</option>
  <option value="150000">Under 150,000 CFA</option>
  <option value="500000">Under 500,000 CFA</option>
  <option value="2000000">Under 2,000,000 CFA</option>
  <option value="10000000">Under 10,000,000 CFA</option>
  <option value="above-10000000">Above 10,000,000 CFA</option>
</select>

  </div>
</div>
  <div class="sub-property-section"></div>
</section>


<!--footer-->
<div id="footer"></div>
<script src="../script/index.js"></script>

<script src="../script/properties-data.js"></script>
<script src="../script/properties-render.js"></script>
</body>
</html>
