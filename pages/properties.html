<section class="browse">
  <!-- Top Box Content -->
  <div class="browse-properties">
    <h1>Browse Properties</h1>
    <p>Find your perfect property in bamenda with our extensive listings</p>
  </div>

  <!-- Filter Section -->
  <div class="filter">
    <h4>Filter Properties</h4>
    
    <!-- Property Type -->
    <div class="filter-group">
      <label for="propertytype">Property Type</label>
      <select name="propertytype" id="propertytype">
        <option value="Bedroom">Bedroom</option>
        <option value="Apartment">Apartment</option>
        <option value="Plots">Plots</option>
      </select>
    </div>

    <!-- Bedrooms -->
    <div class="filter-group">
      <label for="bedrooms">Bedrooms</label>
      <select name="bedrooms" id="bedrooms">
        <option value="all">All</option>
        <option value="one-room">One-room</option>
        <option value="two-rooms">Two-Rooms</option>
      </select>
    </div>

    <!-- Budget -->
    <div class="filter-group">
      <label for="budget">Budget</label>
      <select name="budget" id="budget">
        <option value="all">All</option>
        <option value="low">< 50,000 FCFA</option>
        <option value="mid">50,000 - 100,000 FCFA</option>
      </select>
    </div>
  </div>
</section>

</section>
