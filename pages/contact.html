<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - M&C House</title>
    <link rel="stylesheet" href="../style/contact.css">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <div id="header"></div>

    <section class="contact-hero">
        <h1>Contact Us</h1>
        <p>Get in touch with us for any related queries</p>
    </section>

    <section class="form-container">
        <h3>Send Us a Message</h3>
        <form id="contactForm" class="form-section">
            <div class="input-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="input-group">
                <label for="number">Phone Number</label>
                <input type="tel" id="number" name="phone" placeholder="+237 6xx xxx xxx">
            </div>

            <div class="input-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Type your message here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </section>

    <section class="information">
        <h2>Contact Information</h2>
        <div class="info-block">
            <h5>Phone</h5>
            <a href="tel:+237674765751">Click to call (+237 674765751)</a>
        </div>
        <div class="info-block">
            <h5>WhatsApp</h5>
            <a href="https://wa.me/237674765751?text=Hello%20M%26C%20House,%20I%20have%20a%20question" target="_blank">Click to chat</a>
        </div>
    </section>

    <section class="quick-contact">
        <h2>Quick Contact</h2>
        <p>Need immediate assistance? Call or WhatsApp us now!</p>
        <div class="quick-btns">
            <a href="tel:+237674765751" class="call-btn">Call Now</a>
            <a href="https://wa.me/237674765751" target="_blank" class="wa-btn">WhatsApp Now</a>
        </div>
    </section>

    <div id="footer"></div>

    <script src="../script/index.js"></script>
    <script src="../script/contact.js"></script>
</body>
</html>
