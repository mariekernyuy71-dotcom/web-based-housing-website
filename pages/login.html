<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - M&C House</title>
  <link rel="stylesheet" href="../style/contact.css">
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <div id="header"></div>

  <section class="form-container">
    <h3>Login to Your Account</h3>
    <form id="loginForm" class="form-section">
      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" name="email" placeholder="example@gmail.com" required>
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="submit-btn">Login</button>
      <p style="margin-top: 15px; text-align: center;">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </form>
  </section>

  <div id="footer"></div>

  <script src="../script/index.js"></script>
  <script src="../script/auth.js"></script>
</body>
</html>
