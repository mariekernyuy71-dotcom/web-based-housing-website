 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - M&C House</title>
  <link rel="stylesheet" href="../style/contact.css">
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <div id="header"></div>

  <section class="form-container">
    <h3>Create an Account</h3>
    <form id="registerForm" class="form-section">
      <div class="input-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" name="name" placeholder="marie" required>
      </div>

      <div class="input-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" name="email" placeholder="example@gmail.com" required>
      </div>

      <div class="input-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" name="password" placeholder="Create password" required>
      </div>

      <button type="submit" class="submit-btn">Register</button>
      <p style="margin-top: 15px; text-align: center;">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </form>
  </section>

  <div id="footer"></div>

  <script src="../script/index.js"></script>
  <script src="../script/auth.js"></script>
</body>
</html>
